{% extends 'base.html' %}

{% load static %}
{% block titulo %}Iniciar Sesión{% endblock %}

{% block contenido %}
<div class="usuario-contenedor usuario-contenedor--sm">
    <h1 class="usuario-titulo--centrado">Iniciar Sesión</h1>
    
    <div class="usuario-tarjeta">
        <form method="post">
            {% csrf_token %}
            
            <div class="usuario-campo">
                <label for="username" class="usuario-etiqueta">
                    Nombre de usuario
                </label>
                <input 
                    type="text" 
                    id="username" 
                    name="username" 
                    required
                    class="form-control"
                    autofocus
                >
            </div>
            
            <div class="usuario-campo">
                <label for="password" class="usuario-etiqueta">
                    Contraseña
                </label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    required
                    class="form-control"
                >
            </div>
            
            <button type="submit" class="usuario-boton usuario-boton--primario">
                Iniciar Sesión
            </button>
        </form>
        
        <div class="usuario-enlace-pie">
            <p>
                ¿No tenés cuenta? 
                <a href="{% url 'usuarios:registro' %}" class="usuario-enlace">
                    Registrate gratis
                </a>
            </p>
        </div>
    </div>
</div>

<link rel="stylesheet" href="{% static 'css/usuarios/login.css' %}">
<link rel="stylesheet" href="{% static 'css/usuarios/formularios.css' %}">
{% endblock %}
