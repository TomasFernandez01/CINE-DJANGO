<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}Mi Sitio de Películas{% endblock %}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            background-color: #f4f4f4;
        }
        nav {
            background-color: #333;
            color: white;
            padding: 1rem;
        }
        nav ul {
            list-style: none;
            display: flex;
            gap: 2rem;
        }
        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }
        nav a:hover {
            color: #ddd;
        }
        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        h1 {
            color: #333;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <nav>
        <ul>
            <li><a href="{% url 'peliculas:inicio' %}">Inicio</a></li>
            <li><a href="{% url 'peliculas:lista_peliculas' %}">Películas</a></li>
        </ul>
    </nav>
    
    <div class="container">
        {% block contenido %}
        {% endblock %}
    </div>
</body>
</html>
