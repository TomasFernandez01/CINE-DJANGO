{% extends 'base.html' %}
{% load static %}

{% block titulo %}Elegí película - Cine Online{% endblock %}

{% block extra_css %}
<!-- MEJORAS/REDISEÑO GEMINI: Estilos y componentes compartidos de cartelera y filtros -->
<link rel="stylesheet" href="{% static 'css/shared/fechas_carrusel.css' %}">
<link rel="stylesheet" href="{% static 'css/peliculas/filtros.css' %}">
<link rel="stylesheet" href="{% static 'css/peliculas/buscador.css' %}">
<link rel="stylesheet" href="{% static 'css/peliculas/cartelera.css' %}">
<style>
    /* Estilo de alineación para la cabecera unificada */
    .filtro-buscador-contenedor {
        /*display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 1.5rem;
        margin-bottom: 2rem;
        background-color: #1c1c1c;
        padding: 1.25rem 1.5rem;
        border-radius: 8px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.3);*/
        display: flex;
        gap: 1rem;
        background-color: #000000;
        padding: 1rem 1rem;
        box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        flex-direction: column;
    }
    .buscador-caja {
        flex: 1;
        min-width: 280px;
    }
    .filtros-caja {
        margin-bottom: 0;
        background: none;
        padding: 0;
        box-shadow: none;
    }
    .filtros-grid {
        display: flex;
        gap: 1rem;
        align-items: center;
        flex-wrap: wrap;
    }
    .filtros-campo {
        margin: 0;
    }
    /* Estilo premium del mensaje de vacío */
    .pelis-vacio {
        background-color: #1f1f1f;
        padding: 4rem 2rem;
        border-radius: 12px;
        text-align: center;
        box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        border: 1px solid #333;
        margin: 2rem 0;
    }
    .pelis-vacio-icono {
        font-size: 4rem;
        margin-bottom: 1rem;
    }
    .pelis-vacio-texto-principal {
        color: #ffffff;
        font-size: 1.4rem;
        font-weight: bold;
        margin-bottom: 0.5rem;
    }
    .pelis-vacio-texto-secundario {
        color: #aaaaaa;
        font-size: 1rem;
    }
    .pelis-vacio-link {
        color: #e50914;
        text-decoration: none;
        font-weight: bold;
        border-bottom: 2px solid transparent;
        transition: border-color 0.2s;
    }
    .pelis-vacio-link:hover {
        border-color: #e50914;
    }
</style>
{% endblock %}

{% block contenido %}

<!-- MODIFICACION GEMINI: Buscador y barra de filtros unificados sin carrusel de fechas -->
<div class="filtro-buscador-contenedor">
    <div class="buscador-caja">
        <input
            type="text"
            id="buscar"
            name="buscar"
            value="{{ busqueda }}"
            placeholder="Buscá por título, director o actor..."
            class="filtros-input"
            style="width: 100%;"
            autocomplete="off"
            data-url-buscar-vivo="{% url 'peliculas:lista_peliculas' %}"
        >
    </div>
    
    <div class="filtros-caja">
        <form method="get" action="{% url 'peliculas:lista_peliculas' %}" id="form-filtros">
            <!-- Campo oculto para mantener búsqueda en submit -->
            <input type="hidden" name="buscar" id="hidden-buscar" value="{{ busqueda }}">

            <div class="filtros-grid">
                <!-- Filtro Género -->
                <div class="filtros-campo">
                    <select id="genero" name="genero" class="filtros-select">
                        <option value="">Todos los géneros</option>
                        {% for valor, nombre in generos_disponibles %}
                            <option value="{{ valor }}" {% if genero_seleccionado == valor %}selected{% endif %}>
                                {{ nombre }}
                            </option>
                        {% endfor %}
                    </select>
                </div>

                <!-- Filtro Clasificación -->
                <div class="filtros-campo">
                    <select id="clasificacion" name="clasificacion" class="filtros-select">
                        <option value="">Todas las clasificaciones</option>
                        {% for valor, nombre in clasificaciones_disponibles %}
                            <option value="{{ valor }}" {% if clasificacion_seleccionada == valor %}selected{% endif %}>
                                {{ valor }}
                            </option>
                        {% endfor %}
                    </select>
                </div>
                
                <div class="filtros-botones">
                    <a href="{% url 'peliculas:lista_peliculas' %}" class="filtros-btn-limpiar">Limpiar Filtros</a>
                </div>
            </div>
        </form>
    </div>
</div>

<!-- MODIFICACION GEMINI: Contenedor para la grilla de películas (sin carrusel de fechas) -->
<div id="peliculas-grid-container">
    {% include 'peliculas/partials/_lista_pelis_grid.html' %}
</div>

{% endblock %}

{% block extra_js %}
<!-- MODIFICACION GEMINI: Buscador en vivo -->
<script src="{% static 'js/peliculas/buscador_vivo.js' %}"></script>
{% endblock %}
